[project]
name = "clawifi"
version = "0.4.5"
description = "Official Python SDK, CLI, and MCP server for Clawifi: web search and page reading for AI agents. Free web search MCP server, no API key needed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "mcp", "mcp-server", "web-search", "web-search-api", "web-scraping", "web-crawler",
  "ai-agents", "llm", "rag", "markdown", "pdf-extraction", "search-api",
  "firecrawl-alternative", "tavily-alternative", "exa-alternative", "free-web-search",
  "claude-code", "cursor",
]
dependencies = [
  "httpx>=0.27.2",
  "mcp>=1.30.0,<2",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://clawifi.dev"
Documentation = "https://clawifi.dev/docs"
Repository = "https://github.com/ReARCLabs/clawifi-mcp"

[project.scripts]
clawifi = "clawifi.cli:run"
clawifi-mcp = "clawifi.mcp_server:run"

[project.optional-dependencies]
test = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clawifi = ["py.typed"]
